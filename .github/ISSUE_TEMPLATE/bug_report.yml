name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you got.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, Homebridge and Node.js versions.
      placeholder: "plugin 1.2.0, Homebridge 2.0.0, Node 22.12"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Set `loggingAmount` to 2 and paste the relevant lines. Remove anything personal (site IDs are fine).
      render: text
  - type: textarea
    id: config
    attributes:
      label: Plugin config
      description: Your plugin config WITHOUT the username and password.
      render: json
