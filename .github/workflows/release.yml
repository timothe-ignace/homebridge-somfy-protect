name: Release

# Publishes to npm when a GitHub release is published, using npm trusted publishing (OIDC):
# no npm token is stored anywhere. The trusted publisher (this repository + this workflow file)
# must be registered in the package settings on npmjs.com.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC identity for npm trusted publishing (provenance is generated automatically)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x # npm >= 11.5.1 is required for trusted publishing
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      # a pre-release (3.0.0-beta.1) is published under its own tag (beta), never as "latest"
      - name: Publish
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          case "$VERSION" in
            *-*) TAG="$(node -p 'require("./package.json").version.split("-")[1].split(".")[0]')" ;;
            *) TAG=latest ;;
          esac
          npm publish --access public --tag "$TAG"
